[package]
name = "flexikit-desktop"
version = "0.1.0"
description = "FlexiKit Desktop"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

# Preserve the normal Desktop executable even when another bin is declared.
[[bin]]
name = "flexikit-desktop"
path = "src/main.rs"

# An opt-in binary for testing live Windows resize independently of a running EXE.
# It uses the exact same main.rs implementation; ordinary builds exclude it.
[[bin]]
name = "flexikit-resize-test"
path = "src/main.rs"
required-features = ["resize-test"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-runtime = "2.0"
windows = { version = "=0.61.3", features = ["ApplicationModel", "ApplicationModel_Core", "Management_Deployment", "Media_Control", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
base64 = "=0.22.1"
png = "=0.17.16"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
resize-test = []
